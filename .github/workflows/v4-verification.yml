name: V4 isolated verification
on:
  push:
    branches: [v4-implementation]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: iid_v4_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: iid_v4_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/v4/*.test.mjs
      - run: python3 tests/v4/postgres.py
      - run: npm install --no-audit --no-fund
      - name: Verify committed migration matches tested SQL
        run: cmp sql/v4/engine.sql supabase/migrations/20261016065704_power_balance_v4_staged.sql
      - run: npm test

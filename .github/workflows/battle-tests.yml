name: Global Battle Engine
on:
  pull_request:
    paths:
      - 'public/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/battle-tests.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  sql-and-client-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run SQL/RLS and client contract tests
        run: pnpm test
      - name: Confirm production battle stays paused by default in schema
        run: |
          grep -F "enabled boolean not null default false" supabase/migrations/20261014033444_global_battle_engine.sql
          grep -F "grant execute on function public.iid_battle_tap_batch" supabase/migrations/20261014042237_batch_tap_acknowledgements.sql

name: Test and Deploy Internet Is Dying

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internetisdying-production
  cancel-in-progress: false

jobs:
  test:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Test all application code and SQL migrations
        run: |
          npm test
          node --test tests/v4/*.test.mjs

  deploy:
    name: Deploy existing Cloudflare Worker
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cloudflare deployment credentials
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Publish internetisdying Worker and static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify published Arena and Hall of Fame assets
        shell: bash
        run: |
          set -euo pipefail
          set -x
          ROOT="https://internetisdying.wwwxolf.workers.dev"
          for i in 1 2 3 4 5 6; do
            curl -fsSL --max-time 12 "$ROOT/arena.html" -o /tmp/iid-arena.html || true
            if grep -q 'flow.js?v=36' /tmp/iid-arena.html 2>/dev/null; then
              break
            fi
            sleep 5
          done
          grep -q 'flow.js?v=36' /tmp/iid-arena.html
          curl -fsSL --max-time 15 "$ROOT/hall-of-fame.js?v=4" -o /tmp/iid-hof.js
          grep -q 'iid_hall_of_fame' /tmp/iid-hof.js
          grep -q 'LEGENDARY' /tmp/iid-arena.html
          grep -q 'FACTION POINTS' /tmp/iid-arena.html
          grep -q 'hof-legendary-list' /tmp/iid-arena.html
          grep -q 'renderLegendary' /tmp/iid-hof.js
          grep -q 'hall-of-fame.css?v=3' /tmp/iid-arena.html
          curl -fsSL --max-time 15 "$ROOT/v2-tap-config.js" -o /tmp/iid-v2-config.js
          grep -q 'V2_MAX_TAPS=50' /tmp/iid-v2-config.js
          grep -q 'V2_DURATION_SECONDS=10' /tmp/iid-v2-config.js
          curl -fsSL --max-time 15 "$ROOT/v2-lab.html" -o /tmp/iid-v2-lab.html
          grep -q '2s ready + 10s active' /tmp/iid-v2-lab.html
          curl -fsSL --max-time 15 "$ROOT/global-battle.js?v=13" -o /tmp/iid-battle.js
          grep -q 'WAR INFLUENCE' /tmp/iid-battle.js
          curl -fsSL --max-time 15 "$ROOT/api/war-momentum" -o /tmp/iid-momentum.json
          grep -q '"window_start"' /tmp/iid-momentum.json
          grep -q '"battle_count"' /tmp/iid-momentum.json
          grep -q 'WORLD_001 / CHICKEN APOCALYPSE' /tmp/iid-arena.html
          grep -q 'PATCH THE NET' /tmp/iid-arena.html
          grep -q 'FEED THE CHICKEN' /tmp/iid-arena.html
          grep -q 'CHICKEN-PROOF FIREWALL' /tmp/iid-arena.html
          grep -q 'THE COOP REPORT' /tmp/iid-arena.html
          grep -q 'ONE HUNGRY CHICKEN. TWO SIDES.' /tmp/iid-battle.js
          grep -q 'world001-pecking-globe.svg' /tmp/iid-arena.html
          grep -q 'arena.css?v=12' /tmp/iid-arena.html
          curl -fsSL --max-time 15 "$ROOT/assets/world001-pecking-globe.svg" -o /tmp/iid-pecking-globe.svg
          grep -q 'Four pixel chickens peck the internet globe' /tmp/iid-pecking-globe.svg
          grep -q 'three comic bubbles saying PECK!' /tmp/iid-pecking-globe.svg
          curl -fsSL --max-time 15 "$ROOT/arena.css?v=12" -o /tmp/iid-arena-css.css
          grep -q 'world-core-signal{display:none}' /tmp/iid-arena-css.css
          curl -fsSL --max-time 15 "$ROOT/" -o /tmp/iid-landing.html
          grep -q 'id="join-btn" href="./prologue.html"' /tmp/iid-landing.html
          curl -fsSL --max-time 15 "$ROOT/prologue.html" -o /tmp/iid-prologue.html
          grep -q 'prologue.js?v=2' /tmp/iid-prologue.html
          grep -q 'id="prologue-back"' /tmp/iid-prologue.html
          grep -q 'id="prologue-story-back"' /tmp/iid-prologue.html
          grep -q 'FEED THE CHICKEN' /tmp/iid-prologue.html
          grep -q 'SAVE THE INTERNET' /tmp/iid-prologue.html
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL --max-time 15 "$ROOT/prologue.js?v=2" -o /tmp/iid-prologue.js
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL --max-time 15 "$ROOT/prologue.css?v=2" -o /tmp/iid-prologue.css
          grep -q 'prologue-back' /tmp/iid-prologue.css
          grep -q 'Then one chicken got hungry' /tmp/iid-prologue.js
          curl -fsSL --max-time 15 "$ROOT/breaking-share-card.js?v=4" -o /tmp/iid-share-png.js
          curl -fsSL --max-time 15 "$ROOT/share-story.js" -o /tmp/iid-share-story.js
          grep -q 'world-chicken.svg' /tmp/iid-share-png.js
          grep -q 'INTERNET REPAIRED' /tmp/iid-share-story.js
          grep -q 'CHICKEN DAMAGE' /tmp/iid-share-story.js
          grep -q 'CHAOS BURST' /tmp/iid-share-story.js
          curl -fsSL --max-time 15 "$ROOT/api/v4-summary" -o /tmp/iid-v4-summary.json
          python3 -c 'import json; d=json.load(open("/tmp/iid-v4-summary.json")); assert d is None or (0 <= d["hp"] <= 1000000 and d["status"] in ("ACTIVE","FINAL"))'
          curl -fsSL --max-time 15 "$ROOT/v4-battle.js?v=1" -o /tmp/iid-v4-battle.js
          grep -q 'iid_v4_' /tmp/iid-v4-battle.js
          echo "Verified deployed Arena, legacy assets and staged V4 routing."


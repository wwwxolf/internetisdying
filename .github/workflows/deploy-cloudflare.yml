name: Test and Deploy Internet Is Dying

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internetisdying-production
  cancel-in-progress: false

jobs:
  test:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Test all application code and SQL migrations
        run: npm test

  deploy:
    name: Deploy existing Cloudflare Worker
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cloudflare deployment credentials
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Publish internetisdying Worker and static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify published Arena and Hall of Fame assets
        shell: bash
        run: |
          set -euo pipefail
          set -x
          ROOT="https://internetisdying.wwwxolf.workers.dev"
          for i in 1 2 3 4 5 6; do
            curl -fsSL --max-time 12 "$ROOT/arena.html" -o /tmp/iid-arena.html || true
            if grep -q 'flow.js?v=32' /tmp/iid-arena.html 2>/dev/null; then
              break
            fi
            sleep 5
          done
          grep -q 'flow.js?v=32' /tmp/iid-arena.html
          curl -fsSL --max-time 15 "$ROOT/hall-of-fame.js?v=4" -o /tmp/iid-hof.js
          grep -q 'iid_hall_of_fame' /tmp/iid-hof.js
          grep -q 'LEGENDARY' /tmp/iid-arena.html
          grep -q 'FACTION POINTS' /tmp/iid-arena.html
          grep -q 'hof-legendary-list' /tmp/iid-arena.html
          grep -q 'renderLegendary' /tmp/iid-hof.js
          grep -q 'hall-of-fame.css?v=3' /tmp/iid-arena.html
          curl -fsSL --max-time 15 "$ROOT/v2-tap-config.js" -o /tmp/iid-v2-config.js
          grep -q 'V2_MAX_TAPS=50' /tmp/iid-v2-config.js
          grep -q 'V2_DURATION_SECONDS=10' /tmp/iid-v2-config.js
          curl -fsSL --max-time 15 "$ROOT/v2-lab.html" -o /tmp/iid-v2-lab.html
          grep -q '2s ready + 10s active' /tmp/iid-v2-lab.html
          curl -fsSL --max-time 15 "$ROOT/global-battle.js?v=12" -o /tmp/iid-battle.js
          grep -q 'WAR INFLUENCE' /tmp/iid-battle.js
          curl -fsSL --max-time 15 "$ROOT/api/war-momentum" -o /tmp/iid-momentum.json
          grep -q '"window_start"' /tmp/iid-momentum.json
          grep -q '"battle_count"' /tmp/iid-momentum.json
          echo "Verified deployed Arena, live momentum edge API, Hall of Fame and V2 assets."

   </div>
   <div class="prologue-frame" id="prologue-frame">

    <p class="prologue-fineprint">Sign in to enter the arena. Your side is chosen per battle.</p>
    <button type="button" class="prologue-story-back" id="prologue-story-back">← BACK TO SCENE 04</button>

   <noscript><p class="prologue-noscript">Enable JavaScript for the story, or <a href="./auth.html">continue to sign in →</a></p></noscript>
